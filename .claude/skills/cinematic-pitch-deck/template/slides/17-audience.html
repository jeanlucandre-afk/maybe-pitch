<!-- PATTERN: the room votes (assets/live/audience.js, vote.html, api/poll.js, polls.json).
     Left: the question as a data-slide headline, results as the deck's own bar rows (label, big mono %, bar;
     the leader in the accent). Right: the QR on a CSS phone, the short link under it. One quiet status line.
     Delete data-template once the content is yours. -->
<div class="slide-root" data-template data-shoot-wait="6000" data-poll data-demo-question="Would you have tried it before choosing?" data-demo-options='["Yes, definitely","Maybe","No, I knew already"]'>
  <div style="position:absolute; left:160px; top:140px; width:1000px;">
    <h2 class="h-1 rv" data-poll-question style="--d:.05; max-width:17ch;">Would you have <span class="hl">tried</span> it before choosing?</h2>
  </div>
  <div class="poll-rows rv" data-poll-rows style="--d:.4; position:absolute; left:160px; top:520px; width:900px;"></div>
  <p class="live-note rv" data-poll-status style="--d:.6; position:absolute; left:160px; bottom:96px;"><span data-poll-total>0 votes</span></p>
  <div class="phone fin" style="--d:.2; left:1290px; top:90px; width:450px; height:900px;">
    <div class="screen" style="background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; padding:56px;">
      <p class="kicker" style="font-size:18px;">Scan to vote</p>
      <div class="qr" data-qr></div>
      <p class="num" data-poll-url style="margin:0; font-size:22px; letter-spacing:-0.02em; color:var(--ink-2); text-align:center;"></p>
    </div>
  </div>
</div>
