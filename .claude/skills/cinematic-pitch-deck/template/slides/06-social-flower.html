<!-- PATTERN: "real people are living this". No text. One post screenshot flies in big at the centre, phones with real
     TikToks fly in from depth around it like petals and keep swaying. First phone plays with sound (data-sound). -->
<div class="slide-root">
  <div class="petal" style="--rest: perspective(1600px) rotateY(18deg) rotate(13deg); --fx:-420px; --fy:-380px; --fry:35deg; --d:.8; position:absolute; left:40px; top:-70px; width:270px; height:490px;">
    <div class="phone" style="position:relative; inset:auto; width:100%; height:100%; padding:8px; border-radius:38px;"><div class="screen" style="border-radius:31px;" data-tiktok="https://www.tiktok.com/@user/video/0000000000000000000" data-autoplay></div></div>
  </div>
  <div class="petal" style="--rest: perspective(1600px) rotateY(-18deg) rotate(36deg); --fx:480px; --fy:420px; --fry:-45deg; --d:1.1; position:absolute; left:1640px; top:580px; width:270px; height:490px;">
    <div class="phone" style="position:relative; inset:auto; width:100%; height:100%; padding:8px; border-radius:38px;"><div class="screen" style="border-radius:31px;" data-tiktok="https://www.tiktok.com/@user/video/0000000000000000001" data-autoplay></div></div>
  </div>
  <div class="petal" style="--rest: perspective(1600px) rotateY(16deg) rotate(-17deg); --fx:-500px; --fy:-120px; --fry:40deg; --d:.35; position:absolute; left:250px; top:150px; z-index:1; width:340px; height:620px;">
    <div class="phone" style="position:relative; inset:auto; width:100%; height:100%; padding:10px; border-radius:46px;"><div class="screen" style="border-radius:37px;" data-tiktok="https://www.tiktok.com/@user/video/0000000000000000002" data-autoplay data-sound></div></div>
  </div>
  <figure class="hero-post" style="--d:0; position:absolute; left:660px; top:120px; width:760px; z-index:2; margin:0; border-radius:20px; overflow:hidden; background:#fff; box-shadow:0 60px 120px -50px rgba(0,0,0,.55), 0 0 0 1px var(--line);">
    <div style="height:820px; display:grid; place-items:center; color:var(--ink-3); font-size:24px;">[screenshot of the viral post: media/post.webp]</div>
  </figure>
</div>
