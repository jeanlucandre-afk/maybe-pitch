<!-- PATTERN: the recorded walkthrough (tools/walkthrough/record.mjs). Full bleed on the accent ground, played at 2x,
     restarts every time the slide opens. aria-label describes the whole run for screen readers. -->
<div class="slide-root" style="background:var(--accent);">
  <video data-play data-rate="2" src="media/walkthrough.mp4" muted loop playsinline preload="auto" aria-label="Product walkthrough: [describe every step]" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;"></video>
</div>
