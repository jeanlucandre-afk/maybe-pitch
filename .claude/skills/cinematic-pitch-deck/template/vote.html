<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote</title>
<!-- fonts:start (build.mjs copies the deck's fonts here) --><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><!-- fonts:end -->
<link rel="stylesheet" href="assets/brand.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; padding: 40px 22px calc(32px + env(safe-area-inset-bottom)); }
  main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .kicker { margin: 0; font: 500 14px var(--font-mono); color: var(--ink-3); }
  h1 { margin: 0; font-size: 36px; line-height: 1.04; font-weight: 700; letter-spacing: -0.045em; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  button { position: relative; width: 100%; min-height: 64px; padding: 18px 20px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font: 600 20px var(--font-sans); letter-spacing: -0.01em; text-align: left; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button .t { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 12px; }
  button .pc { font: 500 18px var(--font-mono); color: var(--ink-3); }
  button i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--track); transition: width .7s cubic-bezier(.2,.7,.2,1); }
  button[aria-pressed="true"] { border-color: var(--ink); }
  button[aria-pressed="true"] i { background: var(--accent-soft); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .note { margin: 0; font-size: 16px; line-height: 1.4; color: var(--ink-3); min-height: 22px; }
</style>
</head>
<body>
<main>
  <p class="kicker" id="brand">Live poll</p>
  <h1 id="q">Loading…</h1>
  <div class="opts" id="opts"></div>
  <p class="note" id="note" aria-live="polite"></p>
</main>
<script>
(function () {
  let voter; try { voter = localStorage.getItem('voter'); if (!voter) { voter = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9-]/gi, ''); localStorage.setItem('voter', voter); } } catch (e) { voter = 'anon-' + Math.random().toString(36).slice(2, 12); }
  let mine = null; try { mine = localStorage.getItem('vote'); } catch (e) {}
  const opts = document.getElementById('opts'), note = document.getElementById('note');
  function render(p) {
    document.getElementById('q').textContent = p.question;
    if (!opts.children.length) p.options.forEach((o, i) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = '<i></i><span class="t"><span></span><span class="pc"></span></span>'; b.querySelector('.t span').textContent = o; b.onclick = () => vote(i); opts.appendChild(b); });
    [...opts.children].forEach((b, i) => { b.setAttribute('aria-pressed', String(String(i) === mine)); const share = mine !== null && p.total ? Math.round(p.counts[i] / p.total * 100) : null; b.querySelector('i').style.width = (share || 0) + '%'; b.querySelector('.pc').textContent = share === null ? '' : share + '%'; });
  }
  async function vote(i) {
    note.textContent = 'Sending…';
    try {
      const r = await fetch('api/poll', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ option: i, voter }) });
      if (!r.ok) throw new Error(r.status);
      mine = String(i); try { localStorage.setItem('vote', mine); } catch (e) {}
      render(await r.json()); note.textContent = 'Thanks. Watch the screen. Tap another answer to change your vote.';
    } catch (e) { note.textContent = 'Could not send. Try again.'; }
  }
  fetch('api/poll', { cache: 'no-store' }).then((r) => r.json()).then(render).catch(() => { document.getElementById('q').textContent = 'The poll is not open right now.'; });
})();
</script>
</body>
</html>
