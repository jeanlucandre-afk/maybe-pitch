<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="width: 100%; min-height: 1250px; box-sizing: border-box; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; display: flex; flex-wrap: wrap;">
  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; border-right: 1px solid #E4E4E7; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; background: #FAFAFA;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px; font-size: 17px; font-weight: 700; letter-spacing: -0.03em;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5 L10.5 13 L10.5 20 M20.5 3.5 L11 14.5" fill="none" stroke="#09090B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>MAYBE</div>
    <span style="padding: 0 8px 12px 36px; font-size: 12px; color: #71717A;">for Employers</span>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 12px; border: 1px solid #E4E4E7; border-radius: 8px; background: #FFFFFF; text-align: left; cursor: pointer;"><span style="width: 56px; height: 28px; border-radius: 6px; background: #0A0A0B; display: grid; place-items: center;"><img src="img/logo-dice-white.svg" alt="" style="height: 14px;"></span><span style="flex-grow: 1;"><span style="display: block; font-size: 13px; font-weight: 500;">DICE</span><span style="display: block; font-size: 11px; color: #71717A;">Hiring team · 3 seats</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</a>
    <a href="employer-board.html" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; font-weight: 500; background: #F4F4F5; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>Candidates<span style="margin-left: auto; font-size: 12px; color: #71717A;">42</span></a>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Jobs &amp; challenges</a>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>Interviews<span style="margin-left: auto; padding: 0 6px; border-radius: 999px; background: #7C3AED; color: #FFFFFF; font-size: 11px;">3</span></a>
    <div style="margin-top: 20px; border: 1px solid #E4E4E7; border-radius: 10px; background: #FFFFFF; padding: 12px; font-size: 12px; color: #52525B; line-height: 1.5;"><strong style="color: #09090B; font-weight: 500;">Privacy</strong><br>You only see evidence students chose to share with DICE.</div>
    <p style="margin: auto 8px 0; padding-top: 16px; font-size: 11px; color: #71717A; line-height: 1.5;">DICE shown as a text wordmark. Mockup only, no partnership implied.</p>
  </aside>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px;">
    <nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: #71717A;"><a href="employer-board.html" style="display: inline-flex; align-items: center; gap: 4px; color: #52525B; text-decoration: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Candidates</a><span>/</span><span>Junior Product Designer</span><span>/</span><span style="color: #09090B;">Lena Hoffmann</span></nav>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
      <span style="width: 64px; height: 64px; border-radius: 999px; overflow: hidden; background: #EDE9FE; flex: none;"><img src="img/peep-designer.svg" alt="Drawing of Lena" style="width: 106px; margin: -3px 0 0 -21px; display: block;"></span>
      <div style="flex: 1 1 260px; min-width: 0;">
        <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.035em;">Lena Hoffmann</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: 13px; color: #71717A;"><span>Year 12 · age 16–17</span><span>Berlin</span><span>Available from July 2027</span><span style="display: inline-flex; align-items: center; gap: 6px; color: #15803D;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #22C55E;"></span>Open to internships</span></div>
      </div>
      <button onClick="{{toggleShort}}" aria-pressed="{{short}}" style="height: 36px; padding: 0 14px; border: 1px solid #E4E4E7; border-radius: 8px; background: #FFFFFF; color: #09090B; font: 500 14px Geist, sans-serif; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; border-color: {{shortBorder}}; background: {{shortBg}};"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{shortFill}}" stroke="{{shortStroke}}" stroke-width="2" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/></svg>{{shortLabel}}</button>
      <a href="#" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #09090B; color: #FAFAFA; font: 500 14px Geist, sans-serif; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>Invite to interview</a>
    </div>

    <div role="tablist" aria-label="Candidate sections" style="display: inline-flex; align-self: flex-start; padding: 3px; border-radius: 8px; background: #F4F4F5; flex-wrap: wrap;">
      <template data-for="{{tabs}}" data-as="t"><button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="border: 0; padding: 5px 12px; border-radius: 6px; background: {{t.bg}}; box-shadow: {{t.shadow}}; color: {{t.fg}}; font: 500 13px Geist, sans-serif; cursor: pointer;">{{t.label}}</button></template>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
      <template data-if="{{isEvidence}}">
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden;">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #E4E4E7;">
            <span style="width: 44px; height: 24px; border-radius: 6px; background: #0A0A0B; display: grid; place-items: center; flex: none;"><img src="img/logo-dice-white.svg" alt="DICE" style="height: 12px;"></span>
            <div style="flex-grow: 1; min-width: 0;"><p style="margin: 0; font-size: 15px; font-weight: 600;">Festival checkout redesign</p><p style="margin: 0; font-size: 12px; color: #71717A;">DICE · Product Designer experience · submitted 28 Oct 2026 · 84 min</p></div>
            <a href="design-editor.html" style="font-size: 13px; font-weight: 500;">Open in editor</a>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; padding: 16px; background: #FAFAFA;">
            <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
              <figcaption style="font-size: 12px; font-weight: 500; color: #71717A;">Before · given brief</figcaption>
              <div style="height: 250px; border: 1px solid #E4E4E7; border-radius: 10px; background: #FFFFFF; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
                <span style="height: 10px; width: 60%; border-radius: 3px; background: #D4D4D8;"></span>
                <span style="height: 28px; border-radius: 4px; border: 1px solid #E4E4E7;"></span><span style="height: 28px; border-radius: 4px; border: 1px solid #E4E4E7;"></span><span style="height: 28px; border-radius: 4px; border: 1px solid #E4E4E7;"></span><span style="height: 28px; border-radius: 4px; border: 1px solid #E4E4E7;"></span>
                <span style="height: 8px; width: 80%; border-radius: 3px; background: #F4F4F5;"></span><span style="height: 8px; width: 70%; border-radius: 3px; background: #F4F4F5;"></span>
                <span style="margin-top: auto; height: 30px; border-radius: 4px; background: #A1A1AA;"></span>
                <span style="font-size: 11px; color: #71717A;">5 steps · fees shown at the end</span>
              </div>
            </figure>
            <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
              <figcaption style="font-size: 12px; font-weight: 500; color: #5B21B6;">After · Lena's version</figcaption>
              <div style="height: 250px; border: 1.5px solid #7C3AED; box-shadow: 0 0 0 3px #EDE9FE; border-radius: 10px; background: #0A0A0B; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; color: #FAFAFA;">
                <span style="font-size: 13px; font-weight: 600;">Berlin Summer Festival</span>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #D4D4D8;"><span>2 × General admission</span><span style="font-family: 'Geist Mono', monospace;">€98.00</span></div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #D4D4D8;"><span>Booking fee (shown upfront)</span><span style="font-family: 'Geist Mono', monospace;">€4.00</span></div>
                <span style="height: 1px; background: #27272A;"></span>
                <div style="display: flex; gap: 6px;"><span style="flex-grow: 1; height: 30px; border-radius: 6px; background: #FFFFFF;"></span><span style="flex-grow: 1; height: 30px; border-radius: 6px; border: 1px solid #3F3F46;"></span></div>
                <span style="margin-top: auto; height: 34px; border-radius: 6px; background: #7C3AED; display: grid; place-items: center; font-size: 12px; font-weight: 600;">Pay €102.00</span>
                <span style="font-size: 11px; color: #A1A1AA;">2 steps · Apple Pay first · total always visible</span>
              </div>
            </figure>
          </div>
        </section>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px;">
          <template data-for="{{tiles}}" data-as="s">
            <div style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 14px; display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;"><span style="font-size: 13px; font-weight: 500; color: #52525B;">{{s.label}}</span><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid {{s.pb}}; background: {{s.pg}}; color: {{s.pf}}; font-size: 11px; font-weight: 500; white-space: nowrap;">{{s.prov}}</span></div>
              <p style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em;">{{s.value}}<span style="font-size: 14px; color: #71717A;">{{s.max}}</span></p>
              <p style="margin: 0; font-size: 12px; color: #71717A;">{{s.note}}</p>
            </div>
          </template>
        </div>

        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;"><h2 style="margin: 0; font-size: 15px; font-weight: 600; flex-grow: 1;">Synthetic test · 1,000 fans</h2><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid #FDE68A; background: #FFFBEB; color: #92400E; font-size: 12px; font-weight: 500;">Synthetic estimates · not real fans</span></div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 13px;"><span style="color: #52525B;">Original</span><div style="height: 10px; border-radius: 999px; background: #F4F4F5;"><div style="width: 48%; height: 10px; border-radius: 999px; background: #A1A1AA;"></div></div><span style="font-family: 'Geist Mono', monospace; text-align: right;">48%</span></div>
            <div style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 13px;"><span style="font-weight: 500;">Lena's version</span><div style="height: 10px; border-radius: 999px; background: #F4F4F5;"><div style="width: 71%; height: 10px; border-radius: 999px; background: #7C3AED;"></div></div><span style="font-family: 'Geist Mono', monospace; text-align: right;">71%</span></div>
          </div>
          <p style="margin: 0; font-size: 12px; color: #71717A; line-height: 1.5;">Estimated checkout completion. Biggest drop moved from the fee step (−31%) to payment choice (−9%). Simulated personas only; treat as a direction, not a forecast.</p>
        </section>

        <section style="border: 1px solid #DDD6FE; border-radius: 12px; background: #F5F3FF; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 14px; font-weight: 600; color: #4C1D95; flex-grow: 1;">AI reviewer summary</span><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #DDD6FE; background: #F5F3FF; color: #5B21B6; font-size: 11px; font-weight: 500; white-space: nowrap;">AI review · rubric v1</span></div>
          <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #3B0764;">Lena found the real problem fast: fans abandon when the fee appears late. She cut the flow to two steps, kept the total visible and tested two variants before choosing. Weakest point: the error state for a declined card is missing.</p>
        </section>

        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden;">
          <div style="padding: 12px 16px; border-bottom: 1px solid #E4E4E7; display: flex; justify-content: space-between; align-items: center;"><h2 style="margin: 0; font-size: 15px; font-weight: 600;">Rubric</h2><a href="#" style="font-size: 13px;">View rubric</a></div>
          <div style="overflow-x: auto;"><table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px;">
            <thead><tr style="text-align: left; color: #71717A; font-size: 12px;"><th style="padding: 9px 16px; font-weight: 500; border-bottom: 1px solid #E4E4E7;">Criterion</th><th style="padding: 9px 8px; font-weight: 500; border-bottom: 1px solid #E4E4E7;">Score</th><th style="padding: 9px 8px; font-weight: 500; border-bottom: 1px solid #E4E4E7;">Provenance</th><th style="padding: 9px 16px; font-weight: 500; border-bottom: 1px solid #E4E4E7;">Evidence</th></tr></thead>
            <tbody>
              <template data-for="{{rubric}}" data-as="r"><tr><td style="padding: 10px 16px; border-bottom: 1px solid #F4F4F5;">{{r.c}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #F4F4F5; font-family: 'Geist Mono', monospace;">{{r.s}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #F4F4F5;"><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid {{r.pb}}; background: {{r.pg}}; color: {{r.pf}}; font-size: 11px; font-weight: 500; white-space: nowrap;">{{r.prov}}</span></td><td style="padding: 10px 16px; border-bottom: 1px solid #F4F4F5;"><a href="#" style="font-size: 13px;">{{r.e}}</a></td></tr></template>
            </tbody>
          </table></div>
        </section>
      </template>
      <template data-if="{{isTranscript}}">
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Think-aloud log</h2>
          <p style="margin: 0;"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #71717A;">00:06</span> Fee shows up only on step 4, that's where people leave.</p>
          <p style="margin: 0;"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #71717A;">00:21</span> Trying a version with the total pinned at the bottom.</p>
          <p style="margin: 0;"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #71717A;">00:52</span> Variant B wins in the test, keeping it.</p>
        </section>
      </template>
      <template data-if="{{isFiles}}">
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 12px;">
          <template data-for="{{files}}" data-as="f"><a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none;"><span style="height: 100px; border-radius: 8px; border: 1px solid #E4E4E7; background: #FAFAFA;"></span><span style="font-size: 13px; font-weight: 500;">{{f.n}}</span></a></template>
        </section>
      </template>
      <template data-if="{{isNotes}}">
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 16px; font-size: 13px; color: #52525B;">No team notes yet. Private notes live in the right column.</section>
      </template>
      </div>

      <aside style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Skills verified</h2>
          <template data-for="{{skills}}" data-as="k"><div style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span style="flex-grow: 1;">{{k.n}}</span><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid {{k.pb}}; background: {{k.pg}}; color: {{k.pf}}; font-size: 11px; font-weight: 500;">{{k.prov}}</span></div></template>
        </section>
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 16px; display: flex; flex-direction: column; gap: 8px;">
          <label for="ce-notes" style="font-size: 15px; font-weight: 600;">Private notes</label>
          <textarea id="ce-notes" rows="6" placeholder="Only your hiring team sees this…" style="resize: vertical; padding: 10px 12px; border: 1px solid #E4E4E7; border-radius: 8px; font: 400 13px/1.5 Geist, sans-serif; color: #09090B;">Strong problem framing. Ask about the missing error state in the interview.</textarea>
          <p style="margin: 0; font-size: 12px; color: #71717A;">Never shared with the student.</p>
        </section>
        <section style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FAFAFA; padding: 14px 16px; display: flex; gap: 10px; font-size: 12px; color: #52525B; line-height: 1.5;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 1px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span><strong style="color: #09090B; font-weight: 500;">Shared by the student on 29 Oct 2026.</strong> Lena can withdraw access at any time. Parent consent on file (under 18).</span></section>
      </aside>
    </div>
  </main>
</div>
</template>
<p class="app-note">Fictional candidates · simulated evidence · mockup only, no partnership implied.</p>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Evidence', short: true }; }
  renderVals() {
    const P = {
      rule: { prov: 'Rule-based', pf: '#0E6680', pg: '#FFFFFF', pb: '#A5D8E6' },
      syn: { prov: 'Synthetic estimate', pf: '#92400E', pg: '#FFFBEB', pb: '#FDE68A' },
      ai: { prov: 'AI review', pf: '#5B21B6', pg: '#F5F3FF', pb: '#DDD6FE' }
    };
    const tabs = ['Evidence', 'Transcript', 'Design files', 'Notes'].map((label) => {
      const on = this.state.tab === label;
      return { label, on, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#09090B' : '#71717A', shadow: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none', pick: () => this.setState({ tab: label }) };
    });
    const tiles = [
      { label: 'Rubric score', value: '86', max: '/100', note: 'Top 10% of 42 candidates', ...P.ai },
      { label: 'Checkout success', value: '71%', max: '', note: 'vs 48% original', ...P.syn },
      { label: 'Tasks complete', value: '6', max: '/6', note: 'All brief steps done', ...P.rule },
      { label: 'Accessibility', value: '9', max: '/10', note: 'Contrast and labels pass', ...P.rule }
    ];
    const rubric = [
      { c: 'Problem framing', s: '18/20', e: 'Brief notes, 00:06', ...P.ai },
      { c: 'Flow simplification', s: '19/20', e: 'Frames 2–3', ...P.ai },
      { c: 'Tested before choosing', s: '15/15', e: 'Test runs A, B', ...P.rule },
      { c: 'Conversion lift', s: '+23 pts', e: 'Synthetic run #4', ...P.syn },
      { c: 'Edge cases and errors', s: '8/15', e: 'Frame 4', ...P.ai },
      { c: 'Accessibility checks', s: '9/10', e: 'Auto-check report', ...P.rule }
    ];
    const skills = [
      { n: 'Interaction design', ...P.ai }, { n: 'Usability testing', ...P.rule },
      { n: 'Information hierarchy', ...P.ai }, { n: 'Accessible colour use', ...P.rule }, { n: 'Data-led decisions', ...P.syn }
    ];
    const s = this.state.short;
    return {
      tabs, tiles, rubric, skills,
      files: ['Checkout v1', 'Checkout v2 (submitted)', 'Fee breakdown', 'Error states draft'].map((n) => ({ n })),
      isEvidence: this.state.tab === 'Evidence', isTranscript: this.state.tab === 'Transcript',
      isFiles: this.state.tab === 'Design files', isNotes: this.state.tab === 'Notes',
      short: s, shortLabel: s ? 'Shortlisted' : 'Shortlist', shortBg: s ? '#F5F3FF' : '#FFFFFF', shortBorder: s ? '#7C3AED' : '#E4E4E7',
      shortFill: s ? '#7C3AED' : 'none', shortStroke: s ? '#7C3AED' : '#09090B',
      toggleShort: () => this.setState({ short: !s })
    };
  }
}
DC.mount(Component);
</script>
