<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · MAYBE</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
.sh-card{transition:box-shadow .15s ease,border-color .15s ease}
.sh-card:hover{border-color:#D4D4D8!important;box-shadow:0 8px 24px -12px rgba(0,0,0,.18)!important}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="width: 100%; min-height: 1180px; box-sizing: border-box; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; display: flex; flex-wrap: wrap;">
  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; border-right: 1px solid #E4E4E7; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; background: #FAFAFA;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; font-size: 17px; font-weight: 700; letter-spacing: -0.03em;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5 L10.5 13 L10.5 20 M20.5 3.5 L11 14.5" fill="none" stroke="#09090B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>MAYBE</div>
    <a href="dashboard.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; font-weight: 500; background: #F4F4F5; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Home</a>
    <a href="marketplace.html" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3Z"/></svg>Explore</a>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>My experiences</a>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Portfolio</a>
    <div style="margin-top: 24px; border: 1px solid #E4E4E7; border-radius: 10px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; font-size: 13px; font-weight: 600;">Your progress</p>
      <p style="margin: 0; font-size: 12px; color: #71717A;">1 completed · 1 in progress</p>
      <div style="height: 6px; border-radius: 999px; background: #F4F4F5;"><div style="width: 55%; height: 6px; border-radius: 999px; background: #7C3AED;"></div></div>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px;">
      <span style="width: 32px; height: 32px; border-radius: 999px; overflow: hidden; background: #EDE9FE; flex: none;"><img src="img/peep-student.svg" alt="" style="width: 54px; margin: -2px 0 0 -11px; display: block;"></span>
      <div><p style="margin: 0; font-size: 13px; font-weight: 500;">Jean-Luc Andre</p><p style="margin: 0; font-size: 12px; color: #71717A;">Student</p></div>
    </div>
  </aside>
  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;">
      <div style="flex-grow: 1;"><h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.035em;">Welcome back, Jean-Luc</h1><p style="margin: 4px 0 0; font-size: 15px; color: #71717A;">One experience in progress, one done. Pick up where you left off.</p></div>
      <a href="marketplace.html" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #09090B; font: 500 14px Geist, sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">Explore careers <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px;">
      <article class="sh-card" style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;">
        <div style="height: 200px; position: relative; overflow: hidden; background: #0A0A0B;">
          <img src="img/dice-festival.jpg" alt="Drawn fans in front of a festival stage at night (AI-generated image)" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%;">
          <img src="img/logo-dice-white.svg" alt="DICE" style="position: absolute; left: 18px; top: 16px; height: 30px;">
          <span style="position: absolute; left: 18px; bottom: 14px; padding: 3px 10px; border-radius: 999px; background: rgba(10,10,11,.7); color: #FFFFFF; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,.18);">Continue</span>
        </div>
        <div style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: baseline; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; flex-grow: 1;">Product Designer at DICE</h2><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #71717A;">~40 min left</span></div>
          <div style="display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; font-size: 12px; color: #52525B;"><span>Step 3 of 4 · Synthetic test running</span><span>55%</span></div><div style="height: 6px; border-radius: 999px; background: #F4F4F5;"><div style="width: 55%; height: 6px; border-radius: 999px; background: #7C3AED;"></div></div></div>
          <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 12px;">
            <li style="display: flex; align-items: center; gap: 4px; color: #52525B;"><span style="color: #7C3AED;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Brief</li>
            <li style="display: flex; align-items: center; gap: 4px; color: #52525B;"><span style="color: #7C3AED;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Design</li>
            <li style="display: flex; align-items: center; gap: 4px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #7C3AED;"></span>Testing</li>
            <li style="color: #71717A;">Submit</li>
          </ol>
          <div style="display: flex; align-items: center; gap: 10px;"><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #FDE68A; background: #FFFBEB; color: #92400E; font-size: 11px; font-weight: 500; white-space: nowrap;">Synthetic estimates · not real fans</span><a href="design-editor.html" style="margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: #09090B; color: #FAFAFA; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">Continue <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a></div>
        </div>
      </article>

      <article class="sh-card" style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;">
        <div style="height: 200px; position: relative; overflow: hidden; background: #F7EDE6;">
          <img src="img/drlipp-skincare.jpg" alt="Drawn sales rep on a headset next to lip balm tubes (AI-generated image)" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 48%;">
          <img src="img/logo-drlipp.svg" alt="Dr. Lipp" style="position: absolute; left: 18px; top: 16px; height: 28px;">
          <span style="position: absolute; left: 18px; bottom: 14px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: #FFFFFF; color: #15803D; font-size: 12px; font-weight: 500; border: 1px solid #EBD9CF;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Completed 28 Oct</span>
        </div>
        <div style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em;">Sales Rep at Dr. Lipp</h2>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <div style="padding: 10px 12px; border-radius: 10px; background: #FAFAFA; border: 1px solid #F4F4F5;"><p style="margin: 0; font-size: 12px; color: #71717A;">Overall score</p><p style="margin: 2px 0 0; font-family: 'Geist Mono', monospace; font-size: 22px;">74<span style="font-size: 13px; color: #71717A;">/100</span></p></div>
            <div style="padding: 10px 12px; border-radius: 10px; background: #FAFAFA; border: 1px solid #F4F4F5;"><p style="margin: 0; font-size: 12px; color: #71717A;">Deal outcome · kept separate</p><p style="margin: 2px 0 0; font-size: 15px; font-weight: 600;">1 trial order of 3 calls</p></div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;"><span style="display: flex; gap: 4px;"><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #A5D8E6; color: #0E6680; font-size: 11px; font-weight: 500; white-space: nowrap;">Rule-based</span><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #DDD6FE; background: #F5F3FF; color: #5B21B6; font-size: 11px; font-weight: 500; white-space: nowrap;">AI review</span></span><a href="#" style="margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #09090B; font: 500 14px Geist, sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">See results</a></div>
        </div>
      </article>
    </div>

    <section style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 600;">Your latest scores</h2><span style="font-size: 13px; color: #71717A;">Every score says how it was made</span></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px;">
        <div style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 14px; display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;"><span style="font-size: 13px; font-weight: 500; color: #52525B;">Discovery questions</span><span style="display: flex; gap: 4px;"><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #A5D8E6; color: #0E6680; font-size: 11px; font-weight: 500; white-space: nowrap;">Rule-based</span></span></div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; font-weight: 500; letter-spacing: -0.02em;">8<span style="font-size: 14px; color: #71717A; margin-left: 2px;">/10</span></div><p style="margin: 0; font-size: 12px; color: #71717A;">Dr. Lipp · 6 of 7 checklist questions asked</p></div>
        <div style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 14px; display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;"><span style="font-size: 13px; font-weight: 500; color: #52525B;">Objection handling</span><span style="display: flex; gap: 4px;"><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #DDD6FE; background: #F5F3FF; color: #5B21B6; font-size: 11px; font-weight: 500; white-space: nowrap;">AI review</span></span></div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; font-weight: 500; letter-spacing: -0.02em;">71<span style="font-size: 14px; color: #71717A; margin-left: 2px;">/100</span></div><p style="margin: 0; font-size: 12px; color: #71717A;">Dr. Lipp · against rubric v1</p></div>
        <div style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 14px; display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;"><span style="font-size: 13px; font-weight: 500; color: #52525B;">Checkout completion</span><span style="display: flex; gap: 4px;"><span style="padding: 1px 8px; border-radius: 999px; border: 1px solid #FDE68A; background: #FFFBEB; color: #92400E; font-size: 11px; font-weight: 500; white-space: nowrap;">Synthetic estimate</span></span></div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; font-weight: 500; letter-spacing: -0.02em;">68%</div><p style="margin: 0; font-size: 12px; color: #71717A;">DICE · 1,000 synthetic fans · run 2 of 3</p></div>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; align-items: start;">
      <section style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; justify-content: space-between;"><h2 style="margin: 0; font-size: 16px; font-weight: 600;">Interest map</h2>
          <div style="display: inline-flex; padding: 3px; border-radius: 8px; background: #F4F4F5;"><template data-for="{{modes}}" data-as="m"><button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="border: 0; padding: 4px 10px; border-radius: 6px; background: {{m.bg}}; box-shadow: {{m.shadow}}; color: {{m.fg}}; font: 500 12px Geist, sans-serif; cursor: pointer;">{{m.label}}</button></template></div></div>
        <template data-for="{{bars}}" data-as="b">
          <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px;"><span style="color: #52525B;">{{b.label}}</span><div style="height: 8px; border-radius: 999px; background: #F4F4F5;"><div style="width: {{b.w}}; height: 8px; border-radius: 999px; background: {{b.c}};"></div></div><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #71717A; text-align: right;">{{b.v}}</span></div>
        </template>
        <p style="margin: 0; font-size: 12px; color: #71717A;">{{modeNote}}</p>
      </section>

      <section style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 18px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between;"><h2 style="margin: 0; font-size: 16px; font-weight: 600;">Portfolio</h2><span style="padding: 2px 8px; border-radius: 999px; background: #F4F4F5; color: #3F3F46; font-size: 12px; font-weight: 500;">Private</span></div>
        <div style="display: flex; gap: 10px;">
          <div style="flex: 1; height: 72px; border-radius: 8px; border: 1px solid #E4E4E7; background: #0A0A0B; position: relative; overflow: hidden;"><img src="img/dice-festival.jpg" alt="AI-generated image" style="width: 100%; height: 100%; object-fit: cover; opacity: .9;"></div>
          <div style="flex: 1; height: 72px; border-radius: 8px; border: 1px solid #E4E4E7; background: #F7EDE6; overflow: hidden;"><img src="img/drlipp-skincare.jpg" alt="AI-generated image" style="width: 100%; height: 100%; object-fit: cover;"></div>
        </div>
        <p style="margin: 0; font-size: 13px; color: #52525B; line-height: 1.5;">2 pieces of evidence. Employers only see what you make visible.</p>
        <a href="#" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #09090B; font: 500 14px Geist, sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; align-self: flex-start;">Open portfolio</a>
      </section>
    </div>

    <section style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 600;">Try next</h2><span style="font-size: 13px; color: #71717A;">Based on what you liked in Sales and Design</span></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px;">
        <template data-for="{{next}}" data-as="n">
          <article class="sh-card" style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden;">
            <div style="height: 84px; background: {{n.bg}}; display: grid; place-items: center; border-bottom: 1px solid #F4F4F5;"><img src="{{n.logo}}" alt="{{n.company}} logo" style="height: {{n.h}};"></div>
            <div style="padding: 12px 14px; display: flex; align-items: center; gap: 8px;"><div style="flex-grow: 1;"><p style="margin: 0; font-size: 14px; font-weight: 600;">{{n.role}}</p><p style="margin: 0; font-size: 12px; color: #71717A;">{{n.company}} · {{n.why}}</p></div><button onClick="{{n.toggle}}" style="height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #E4E4E7; background: {{n.btnBg}}; color: #09090B; font: 500 12px Geist, sans-serif; cursor: pointer;">{{n.btn}}</button></div>
          </article>
        </template>
      </div>
      <p style="margin: 0; font-size: 12px; color: #71717A;">Company names shown as text wordmarks. Mockup only, no partnership implied.</p>
    </section>
  </main>
</div>
</template>
<p class="app-note">Example companies · mockup only, no partnership implied. Company names shown as text wordmarks; cover images are AI-generated.</p>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'Tried', notify: {} }; }
  renderVals() {
    const mode = this.state.mode;
    const modes = ['Tried', 'Liked'].map((label) => { const on = mode === label; return { label, on, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#09090B' : '#52525B', shadow: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none', pick: () => this.setState({ mode: label }) }; });
    const data = mode === 'Tried'
      ? [['Sales', 100, '1'], ['Design', 55, '0.5'], ['Marketing', 0, '0'], ['Operations', 0, '0'], ['Product', 0, '0']]
      : [['Sales', 70, '3.5/5'], ['Design', 90, '4.5/5'], ['Marketing', 0, '–'], ['Operations', 0, '–'], ['Product', 0, '–']];
    const bars = data.map(([label, w, v]) => ({ label, w: w + '%', v, c: '#7C3AED' }));
    const modeNote = mode === 'Tried' ? 'Experiences finished per category. Half means in progress.' : 'Your own ratings after each experience.';
    const notify = this.state.notify;
    const base = [
      { id: 'spotify', company: 'Spotify', role: 'Marketing Strategist', why: 'Soon', bg: '#121212', logo: 'img/logo-spotify.svg', h: '34px' },
      { id: 'zalando', company: 'Zalando', role: 'Product Manager', why: 'Soon', bg: '#FFF4EC', logo: 'img/logo-zalando.svg', h: '30px' },
      { id: 'dhl', company: 'DHL', role: 'Operations Analyst', why: 'Soon', bg: '#FFCC00', logo: 'img/logo-dhl.svg', h: '44px' }
    ];
    const next = base.map((n) => { const on = !!notify[n.id]; return { ...n, btn: on ? 'Notified' : 'Notify me', btnBg: on ? '#F4F4F5' : '#FFFFFF', toggle: () => this.setState({ notify: { ...notify, [n.id]: !on } }) }; });
    return { modes, bars, modeNote, next };
  }
}
DC.mount(Component);
</script>
</body>
</html>
