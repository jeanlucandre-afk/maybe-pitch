<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore careers · MAYBE</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Fraunces:opsz,wght@9..144,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
.sh-card{transition:box-shadow .15s ease,border-color .15s ease}
.sh-card:hover{border-color:#D4D4D8!important;box-shadow:0 8px 24px -12px rgba(0,0,0,.18)!important}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="width: 100%; min-height: 1240px; box-sizing: border-box; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; display: flex; flex-wrap: wrap;">
  <!-- sidebar -->
  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; border-right: 1px solid #E4E4E7; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; background: #FAFAFA;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; font-size: 17px; font-weight: 700; letter-spacing: -0.03em;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5 L10.5 13 L10.5 20 M20.5 3.5 L11 14.5" fill="none" stroke="#09090B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>MAYBE</div>
    <a href="dashboard.html" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Home</a>
    <a href="marketplace.html" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; font-weight: 500; background: #F4F4F5; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3Z"/></svg>Explore</a>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>My experiences</a>
    <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #52525B; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Portfolio</a>
    <div style="margin-top: 24px; border: 1px solid #E4E4E7; border-radius: 10px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; font-size: 13px; font-weight: 600;">Your progress</p>
      <p style="margin: 0; font-size: 12px; color: #71717A;">1 completed · 1 in progress</p>
      <div style="height: 6px; border-radius: 999px; background: #F4F4F5;"><div style="width: 55%; height: 6px; border-radius: 999px; background: #7C3AED;"></div></div>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px;">
      <span style="width: 32px; height: 32px; border-radius: 999px; overflow: hidden; background: #EDE9FE; flex: none;"><img src="img/peep-student.svg" alt="" style="width: 54px; margin: -2px 0 0 -11px; display: block;"></span>
      <div><p style="margin: 0; font-size: 13px; font-weight: 500;">Jean-Luc Andre</p><p style="margin: 0; font-size: 12px; color: #71717A;">Student</p></div>
    </div>
  </aside>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;">
      <div style="flex-grow: 1;"><h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.035em;">Explore careers</h1><p style="margin: 4px 0 0; font-size: 15px; color: #71717A;">Try real work from real companies. About an hour each.</p></div>
      <label style="flex: 0 1 320px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input aria-label="Search careers" placeholder="Search careers…" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font: 400 14px Geist, sans-serif; background: transparent;"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; color: #71717A; border: 1px solid #E4E4E7; border-radius: 4px; padding: 1px 5px; background: #F4F4F5;">⌘K</span></label>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
      <template data-for="{{cats}}" data-as="c">
        <button onClick="{{c.pick}}" style="height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 500 13px Geist, sans-serif; cursor: pointer;">{{c.label}}</button>
      </template>
      <span style="margin-left: auto; display: flex; gap: 8px;">
        <button style="height: 32px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 8px; background: #FFFFFF; font: 500 13px Geist, sans-serif; display: inline-flex; align-items: center; gap: 6px;">Duration <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button style="height: 32px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 8px; background: #FFFFFF; font: 500 13px Geist, sans-serif; display: inline-flex; align-items: center; gap: 6px;">Level <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; font-weight: 500; color: #71717A;">Choose a company</span>
      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <template data-for="{{companies}}" data-as="co">
          <button onClick="{{co.pick}}" aria-label="{{co.name}}" aria-pressed="{{co.on}}" style="height: 52px; min-width: 104px; padding: 0 16px; border-radius: 10px; border: {{co.border}}; background: {{co.bg}}; display: grid; place-items: center; cursor: pointer; box-shadow: {{co.shadow}};"><img src="{{co.logo}}" alt="" style="height: {{co.h}}; width: auto; display: block;"></button>
        </template>
      </div>
    </div>

    <!-- featured -->
    <section style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 600;">Live now</h2><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; background: #F0FDF4; color: #15803D; font-size: 12px; font-weight: 500;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #22C55E;"></span>2 playable</span></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px;">
        <article class="sh-card" style="border: 1px solid #E4E4E7; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04);">
          <div style="height: 260px; position: relative; overflow: hidden; background: #0A0A0B;">
            <img src="img/dice-festival.jpg" alt="Drawn fans in front of a festival stage at night, with a ticket checkout card floating above them (AI-generated image)" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block;">
            <div style="position: absolute; left: 0; top: 0; width: 60%; height: 50%; background: radial-gradient(ellipse at 0% 0%, rgba(10,10,11,.55), rgba(10,10,11,0) 70%);"></div>
            <img src="img/logo-dice-white.svg" alt="DICE" style="position: absolute; left: 20px; top: 18px; height: 34px;">
            <span style="position: absolute; left: 20px; bottom: 16px; padding: 3px 10px; border-radius: 999px; background: rgba(10,10,11,.6); color: #FFFFFF; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,.18);">Berlin Summer Festival · checkout</span>
            <button aria-label="Save" style="position: absolute; right: 14px; top: 14px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.1); display: grid; place-items: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg></button>
          </div>
          <div style="padding: 18px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; gap: 6px;"><span style="padding: 2px 8px; border-radius: 6px; background: #EDE9FE; color: #5B21B6; font-size: 12px; font-weight: 500;">UX/UI Design</span><span style="padding: 1px 8px; border-radius: 6px; border: 1px solid #E4E4E7; font-size: 12px; font-weight: 500;">Intermediate</span></div>
            <h3 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em;">Product Designer at DICE</h3>
            <p style="margin: 0; font-size: 14px; color: #71717A; line-height: 1.5;">The festival checkout loses fans. Redesign it in the editor, test it with 1,000 synthetic users and submit your best version.</p>
            <div style="display: flex; align-items: center; gap: 14px; font-size: 13px; color: #71717A;"><span>~90 min</span><span>Design editor</span><span>Synthetic testing</span><a href="design-editor.html" style="margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: #09090B; color: #FAFAFA; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">Start <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a></div>
          </div>
        </article>
        <article class="sh-card" style="border: 1px solid #E4E4E7; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04);">
          <div style="height: 260px; position: relative; overflow: hidden; background: #F7EDE6;">
            <img src="img/drlipp-skincare.jpg" alt="Drawn sales rep on a headset next to lip balm tubes, with a live call card floating between them (AI-generated image)" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 48%; display: block;">
            <img src="img/logo-drlipp.svg" alt="Dr. Lipp" style="position: absolute; left: 20px; top: 18px; height: 32px;">
            <span style="position: absolute; left: 20px; bottom: 16px; padding: 3px 10px; border-radius: 999px; background: #FFFFFF; color: #2E1A22; font-size: 12px; font-weight: 500; border: 1px solid #EBD9CF;">Skincare · 3 retail buyers</span>
            <button aria-label="Save" style="position: absolute; right: 14px; top: 14px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid #EBD9CF; background: #FFFFFF; display: grid; place-items: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2E1A22" stroke-width="2" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg></button>
          </div>
          <div style="padding: 18px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; gap: 6px;"><span style="padding: 2px 8px; border-radius: 6px; background: #EDE9FE; color: #5B21B6; font-size: 12px; font-weight: 500;">Sales</span><span style="padding: 1px 8px; border-radius: 6px; border: 1px solid #E4E4E7; font-size: 12px; font-weight: 500;">Beginner</span></div>
            <h3 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em;">Sales Rep at Dr. Lipp</h3>
            <p style="margin: 0; font-size: 14px; color: #71717A; line-height: 1.5;">Call three AI retail buyers by voice, handle price and shelf-space objections, update the CRM and try to close a trial order.</p>
            <div style="display: flex; align-items: center; gap: 14px; font-size: 13px; color: #71717A;"><span>~60 min</span><span>Voice calls</span><span>CRM</span><a href="trial-dr-lipp.html" style="margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: #09090B; color: #FAFAFA; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">Start <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a></div>
          </div>
        </article>
      </div>
    </section>

    <!-- more companies -->
    <section style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; gap: 10px;"><h2 style="margin: 0; font-size: 18px; font-weight: 600;">Coming soon</h2><span style="font-size: 13px; color: #71717A;">Preview the brief, get notified when it opens</span></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px;">
        <template data-for="{{previews}}" data-as="p">
          <article class="sh-card" style="border: 1px solid #E4E4E7; border-radius: 12px; overflow: hidden; background: #FFFFFF;">
            <div style="height: 104px; background: {{p.bg}}; display: grid; place-items: center; border-bottom: 1px solid #F4F4F5;"><img src="{{p.logo}}" alt="{{p.company}} logo" style="height: {{p.h}}; width: auto;"></div>
            <div style="padding: 14px; display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #71717A;"><span style="font-weight: 500; color: #09090B;">{{p.company}}</span><span>·</span><span>{{p.cat}}</span></div>
              <h3 style="margin: 0; font-size: 15px; font-weight: 600;">{{p.role}}</h3>
              <p style="margin: 0; font-size: 13px; color: #71717A; min-height: 36px;">{{p.task}}</p>
              <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #71717A; margin-top: 2px;"><span>{{p.time}}</span><button onClick="{{p.toggle}}" style="margin-left: auto; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #E4E4E7; background: {{p.btnBg}}; color: {{p.btnFg}}; font: 500 12px Geist, sans-serif; cursor: pointer;">{{p.btn}}</button></div>
            </div>
          </article>
        </template>
      </div>
      <p style="margin: 0; font-size: 12px; color: #71717A;">Example companies: logos are their official marks (via the open-source Simple Icons and Iconify sets); DICE and Dr. Lipp are text stand-ins. Cover images AI-generated. Mockup only, no partnership implied.</p>
    </section>
  </main>
</div>
</template>
<p class="app-note">Example companies · mockup only, no partnership implied. Logos are the companies' official marks; DICE and Dr. Lipp are text stand-ins. Cover images are AI-generated.</p>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'All', notify: { spotify: true }, co: 'dice' }; }
  renderVals() {
    const labels = ['All', 'Design', 'Sales', 'Product', 'Marketing', 'Operations', 'Engineering'];
    const cats = labels.map((label) => {
      const on = this.state.cat === label;
      return { label, bg: on ? '#09090B' : '#FFFFFF', fg: on ? '#FAFAFA' : '#09090B', border: on ? '#09090B' : '#E4E4E7', pick: () => this.setState({ cat: label }) };
    });
    const L = {
      spotify: 'img/logo-spotify.svg', dhl: 'img/logo-dhl.svg', zalando: 'img/logo-zalando.svg',
      personio: 'img/logo-personio.svg', hubspot: 'img/logo-hubspot.svg', n26: 'img/logo-n26.svg',
      siemens: 'img/logo-siemens.svg', lufthansa: 'img/logo-lufthansa.svg'
    };
    const base = [
      { id: 'spotify', company: 'Spotify', cat: 'Marketing', role: 'Marketing Strategist', task: 'Plan the launch of a new German podcast.', time: '~60 min', bg: '#121212', logo: L.spotify, h: '44px' },
      { id: 'dhl', company: 'DHL', cat: 'Operations', role: 'Operations Analyst', task: 'Find why parcels miss next-day delivery.', time: '~75 min', bg: '#FFCC00', logo: L.dhl, h: '28px' },
      { id: 'zalando', company: 'Zalando', cat: 'Product', role: 'Product Manager', task: 'Prioritize a roadmap to cut returns.', time: '~75 min', bg: '#FFF4EC', logo: L.zalando, h: '36px' },
      { id: 'personio', company: 'Personio', cat: 'People', role: 'HR Generalist', task: 'Design onboarding for 20 new hires.', time: '~60 min', bg: '#F4F4F5', logo: L.personio, h: '34px' },
      { id: 'hubspot', company: 'HubSpot', cat: 'Sales', role: 'Customer Success', task: 'Save an account that wants to churn.', time: '~60 min', bg: '#FFF1EC', logo: L.hubspot, h: '40px' },
      { id: 'n26', company: 'N26', cat: 'Data', role: 'Data Analyst', task: 'Spot a fraud pattern in transactions.', time: '~75 min', bg: '#E6F4F1', logo: L.n26, h: '40px' },
      { id: 'siemens', company: 'Siemens', cat: 'Engineering', role: 'Systems Engineer', task: 'Plan sensors for a smart factory line.', time: '~90 min', bg: '#E6F5F5', logo: L.siemens, h: '26px' },
      { id: 'lufthansa', company: 'Lufthansa', cat: 'Operations', role: 'Network Planner', task: 'Rebuild a schedule after a storm.', time: '~90 min', bg: '#FFF6DF', logo: L.lufthansa, h: '36px' }
    ];
    const notify = this.state.notify;
    const previews = base.map((p) => {
      const on = !!notify[p.id];
      return { ...p, btn: on ? 'Notified' : 'Notify me', btnBg: on ? '#F4F4F5' : '#FFFFFF', btnFg: on ? '#52525B' : '#09090B', toggle: () => this.setState({ notify: { ...notify, [p.id]: !on } }) };
    });
    const coList = [
      { id: 'dice', name: 'DICE', logo: 'img/logo-dice.svg', h: '22px' },
      { id: 'lipp', name: 'Dr. Lipp', logo: 'img/logo-drlipp.svg', h: '22px' },
      { id: 'spotify', name: 'Spotify', logo: L.spotify, h: '24px' },
      { id: 'dhl', name: 'DHL', logo: L.dhl, h: '14px' },
      { id: 'zalando', name: 'Zalando', logo: L.zalando, h: '20px' },
      { id: 'personio', name: 'Personio', logo: L.personio, h: '20px' },
      { id: 'hubspot', name: 'HubSpot', logo: L.hubspot, h: '22px' },
      { id: 'n26', name: 'N26', logo: L.n26, h: '22px' },
      { id: 'siemens', name: 'Siemens', logo: L.siemens, h: '14px' },
      { id: 'lufthansa', name: 'Lufthansa', logo: L.lufthansa, h: '22px' }
    ];
    const co = this.state.co;
    const companies = coList.map((c) => {
      const on = co === c.id;
      return { ...c, on, bg: on ? '#F5F3FF' : '#FFFFFF', border: on ? '1.5px solid #7C3AED' : '1px solid #E4E4E7', shadow: on ? '0 0 0 3px #EDE9FE' : '0 1px 2px rgba(0,0,0,.04)', pick: () => this.setState({ co: on ? null : c.id }) };
    });
    return { cats, previews, companies };
  }
}
DC.mount(Component);
</script>
</body>
</html>
