<!doctype html>
<!-- Source of the four provisional career covers (marketing, product, data, finance).
     Open Peeps plus a floating UI card, in the style of the MAYBE covers. No generated images, no numbers.
     Replace the .jpg files in this folder with final art when it exists; nothing else has to change. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career covers, provisional montage</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#3f3f46;font-family:Geist,system-ui,sans-serif;color:#09090B;-webkit-font-smoothing:antialiased;display:grid;gap:40px;grid-template-columns:repeat(2,1200px);padding:40px}
.c{position:relative;width:1200px;height:976px;overflow:hidden}
.peep{position:absolute;display:block}
.card{position:absolute;background:#fff;border:1px solid #E4E4E7;border-radius:22px;box-shadow:0 26px 60px -22px rgba(9,9,11,.5);padding:34px 36px}
.card h3{margin:0;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.sub{margin:8px 0 0;font-size:24px;color:#71717A}
.pill{display:inline-flex;align-items:center;padding:6px 15px;border-radius:999px;border:1.5px solid;font-size:24px;font-weight:500}
.rule{color:#0E6680;border-color:#A5D8E6;background:#fff}
.syn{color:#92400E;border-color:#FDE68A;background:#FFFBEB}
.ai{color:#5B21B6;border-color:#DDD6FE;background:#F5F3FF}
.row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:20px;font-size:24px;font-weight:500}
.bar{display:block;height:14px;border-radius:99px;background:#F4F4F5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#7C3AED}
.bar i.ink{background:#09090B}

/* Marketing */
#marketing{background:#E4E4E7}
#marketing .disc{position:absolute;right:-120px;top:120px;width:800px;height:800px;border-radius:50%;background:#FAFAFA}
#marketing .peep{right:-30px;bottom:-250px;height:1090px}
#marketing .card{left:44px;top:420px;width:600px;transform:rotate(-3deg) scale(1.22);transform-origin:0 50%}

/* Product */
#product{background:#18181B}
#product .ring{position:absolute;left:560px;top:150px;width:760px;height:760px;border-radius:50%;background:#3F3F46}
#product .peep{right:-70px;bottom:-280px;height:1100px}
#product .card{left:40px;top:376px;width:640px;transform:rotate(2.5deg) scale(1.22);transform-origin:0 50%}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.lane{background:#FAFAFA;border:1px solid #E4E4E7;border-radius:14px;padding:13px;display:grid;gap:11px;align-content:start;min-height:230px}
.lane b{font-size:24px;font-weight:500;color:#52525B}
.tile{height:50px;border-radius:9px;background:#fff;border:1px solid #E4E4E7}
.tile.on{border:2.5px solid #7C3AED;box-shadow:0 0 0 5px #EDE9FE}

/* Data */
#data{background:#FAFAFA}
#data .disc{position:absolute;right:-110px;top:110px;width:820px;height:820px;border-radius:50%;background:#E4E4E7}
#data .peep{right:-46px;bottom:-250px;height:1090px}
#data .card{left:44px;top:362px;width:620px;transform:rotate(-2.5deg) scale(1.22);transform-origin:0 50%}
.chart{display:flex;align-items:flex-end;gap:15px;height:270px;margin-top:22px;padding-bottom:3px;border-bottom:3px solid #09090B}
.chart i{flex:1;border-radius:7px 7px 0 0;background:#D4D4D8}
.chart i.on{background:#7C3AED}

/* Finance */
#finance{background:#09090B}
#finance .ring{position:absolute;right:-90px;top:80px;width:840px;height:840px;border-radius:50%;border:3px solid #3F3F46}
#finance .ring.b{right:40px;top:210px;width:580px;height:580px}
#finance .peep{right:-16px;bottom:-250px;height:1090px}
#finance .card{left:42px;top:420px;width:620px;transform:rotate(-2deg) scale(1.22);transform-origin:0 50%}
.who{display:flex;align-items:center;gap:14px;margin-top:26px;padding-top:22px;border-top:1px solid #E4E4E7;font-size:24px;font-weight:500}
.who img{width:60px;height:60px;border-radius:50%;background:#F4F4F5;object-fit:cover;object-position:50% 6%;border:1px solid #E4E4E7}
</style>
</head>
<body>
<section class="c" id="marketing">
  <div class="disc"></div>
  <img class="peep" src="../../app/img/peep-thinker.svg" alt="">
  <div class="card">
    <h3>Launch campaign</h3>
    <p class="sub">Testing the message</p>
    <div class="row"><span>Email</span><span class="bar"><i style="width:72%"></i></span></div>
    <div class="row"><span>Social</span><span class="bar"><i style="width:44%"></i></span></div>
    <div class="row"><span>Landing</span><span class="bar"><i style="width:61%"></i></span></div>
    <p style="margin:28px 0 0"><span class="pill syn">Synthetic estimate</span></p>
  </div>
</section>
<section class="c" id="product">
  <div class="ring"></div>
  <img class="peep" src="../../app/img/peep-designer.svg" alt="">
  <div class="card">
    <h3>What do we build next?</h3>
    <div class="board">
      <div class="lane"><b>Now</b><div class="tile"></div><div class="tile on"></div></div>
      <div class="lane"><b>Next</b><div class="tile"></div><div class="tile"></div></div>
      <div class="lane"><b>Later</b><div class="tile"></div></div>
    </div>
    <p style="margin:24px 0 0"><span class="pill ai">AI review</span></p>
  </div>
</section>
<section class="c" id="data">
  <div class="disc"></div>
  <img class="peep" src="../../app/img/peep-recruiter.svg" alt="">
  <div class="card">
    <h3>Where do users drop off?</h3>
    <div class="chart">
      <i style="height:100%"></i><i style="height:82%"></i><i style="height:74%"></i><i class="on" style="height:34%"></i><i style="height:30%"></i><i style="height:25%"></i><i style="height:20%"></i>
    </div>
    <p style="margin:24px 0 0"><span class="pill rule">Rule-based</span> <span class="sub" style="margin-left:8px">Simulated dataset</span></p>
  </div>
</section>
<section class="c" id="finance">
  <div class="ring"></div><div class="ring b"></div>
  <img class="peep" src="../../app/img/peep-student.svg" alt="">
  <div class="card">
    <h3>Next quarter's budget</h3>
    <p class="sub">Simulated company</p>
    <div class="row"><span>People</span><span class="bar"><i class="ink" style="width:82%"></i></span></div>
    <div class="row"><span>Tools</span><span class="bar"><i class="ink" style="width:36%"></i></span></div>
    <div class="row"><span>Growth</span><span class="bar"><i style="width:58%"></i></span></div>
    <div class="who"><img src="../../app/img/peep-recruiter.svg" alt=""><span>Simulated CFO</span><span class="pill ai" style="margin-left:auto">AI review</span></div>
  </div>
</section>
</body>
</html>
