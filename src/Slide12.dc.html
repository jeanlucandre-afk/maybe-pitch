<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAYBE · Closing questions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes rv{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%) rotate(4deg)}60%{transform:translateY(-6%) rotate(-2deg)}80%{transform:translateY(2%)}100%{transform:translateY(0) rotate(0)}}
@keyframes drift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.08) translateY(-4%)}}
@keyframes frame-in{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scroll-shot{0%,15%{transform:translateY(0)}55%,70%{transform:translateY(var(--shot-scroll,-18%))}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-on .rv{animation:rv calc(.7s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .rise{animation:rise calc(.8s * var(--spd)) cubic-bezier(.3,.7,.2,1) both}
.anim-on .drift{animation:drift calc(9s * var(--spd)) ease-in-out infinite alternate}
.anim-on .fin{animation:frame-in calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .shot{animation:scroll-shot calc(14s * var(--spd)) ease-in-out 1.4s infinite}
.anim-on .grow{transform-origin:left center;animation:grow calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rv,.rise,.drift,.fin,.shot,.grow{animation:none!important}}
</style>
</helmet>
<div class="{{animClass}}" style="--spd: {{spd}}; width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #09090B; color: #FAFAFA; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 160px; right: 160px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 72px;">
    <p class="rv" style="margin: 0; max-width: 27ch; font-size: 88px; font-weight: 700; line-height: 1.04; letter-spacing: -0.045em; animation-delay: calc(var(--spd) * 0.30s);">How are you supposed to know what you want to do if you’ve never <span style="color: {{accent}};">tried</span> it?</p>
    <p class="rv" style="margin: 0; max-width: 30ch; font-size: 72px; font-weight: 700; line-height: 1.06; letter-spacing: -0.045em; color: #D4D4D8; animation-delay: calc(var(--spd) * 1.60s);">And how are employers supposed to recognize your potential if you never get the chance to <span style="color: {{accent}};">demonstrate</span> it?</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate": {"editor": "boolean", "default": true, "section": "Motion"}, "speed": {"editor": "enum", "options": ["slow", "normal", "fast"], "default": "normal", "section": "Motion"}, "accent": {"editor": "color", "options": ["#A78BFA", "#FAFAFA", "#C4B5FD"], "default": "#A78BFA", "section": "Look"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.animate ?? true;
    const spd = { slow: 1.5, normal: 1, fast: 0.6 }[this.props.speed ?? 'normal'] ?? 1;
    const accent = this.props.accent ?? "#A78BFA";
    return {
      animClass: on ? 'anim-on' : 'anim-off',
      spd: String(spd),
      accent,
    };
  }
}
</script>
</body>
</html>
