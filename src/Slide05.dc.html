<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAYBE · Dr. Lipp sales trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes rv{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%) rotate(4deg)}60%{transform:translateY(-6%) rotate(-2deg)}80%{transform:translateY(2%)}100%{transform:translateY(0) rotate(0)}}
@keyframes drift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.08) translateY(-4%)}}
@keyframes frame-in{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scroll-shot{0%,15%{transform:translateY(0)}55%,70%{transform:translateY(var(--shot-scroll,-18%))}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-on .rv{animation:rv calc(.7s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .rise{animation:rise calc(.8s * var(--spd)) cubic-bezier(.3,.7,.2,1) both}
.anim-on .drift{animation:drift calc(9s * var(--spd)) ease-in-out infinite alternate}
.anim-on .fin{animation:frame-in calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .shot{animation:scroll-shot calc(14s * var(--spd)) ease-in-out 1.4s infinite}
.anim-on .grow{transform-origin:left center;animation:grow calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rv,.rise,.drift,.fin,.shot,.grow{animation:none!important}}
</style>
</helmet>
<div class="{{animClass}}" style="--spd: {{spd}}; width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 72px; top: 32px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; letter-spacing: -0.035em; color: #09090B;"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5 L10.5 13 L10.5 20 M20.5 3.5 L11 14.5" fill="none" stroke="#09090B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>MAYBE</div>
  <div style="position: absolute; left: 0; top: 0; height: 4px; width: 45.5%; background: #7C3AED;"></div>
  <div style="position: absolute; right: 72px; bottom: 32px; font-family: 'Geist Mono', monospace; font-size: 16px; color: #71717A;">5 / 11</div>
  <div style="position: absolute; left: 120px; right: 120px; top: 0; bottom: 0; display: grid; grid-template-columns: 600px 936px; gap: 72px; align-items: center;">
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <p class="rv" style="margin: 0 0 18px; font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500; letter-spacing: .02em; color: #71717A; animation-delay: calc(var(--spd) * 0.00s);"><span style="color: #5B21B6;">05</span> · Sales trial</p>
      <span class="rv" style="animation-delay: calc(var(--spd) * 0.09s); align-self: flex-start; padding: 6px 14px; border-radius: 8px; background: #09090B; color: #FAFAFA; font-size: 17px; font-weight: 500;">MAYBE trial · Simulated</span>
      <h2 class="rv" style="margin: 0; font-size: 80px; font-weight: 700; line-height: 1; letter-spacing: -0.045em; font-size: 72px; animation-delay: calc(var(--spd) * 0.18s);">Sell for Dr. Lipp</h2>
      <p class="rv" style="margin: 22px 0 0; font-size: 28px; line-height: 1.45; color: #52525B; margin: 0; font-size: 26px; animation-delay: calc(var(--spd) * 0.27s);">Call three AI retail buyers by voice. Handle objections. Keep the CRM clean. Try to land a trial order.</p>
      <figure class="rv" style="animation-delay: calc(var(--spd) * 0.36s); position: relative; margin: 10px 0 0; border-radius: 14px; overflow: hidden; border: 1px solid #E4E4E7; height: 300px;"><img class="drift" src="/_blob/e46cbcfb0821431f081efe2ed495e72e" alt="Drawn sales rep on a headset next to lip balm tubes, with a live call card" style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.08);"><figcaption style="position: absolute; left: 12px; bottom: 12px; font-size: 14px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: #52525B; border: 1px solid #E4E4E7;">AI-generated image</figcaption></figure>
    </div>
    <div class="fin" style="animation-delay: calc(var(--spd) * 0.18s); box-sizing: border-box; width: 936px; border: 1px solid #E4E4E7; border-radius: 16px; background: #FFFFFF; box-shadow: 0 30px 70px -30px rgba(9,9,11,.38); overflow: hidden; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #E4E4E7; background: #FAFAFA;"><span style="display: flex; gap: 7px;" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 999px; background: #D4D4D8;"></span><span style="width: 12px; height: 12px; border-radius: 999px; background: #D4D4D8;"></span><span style="width: 12px; height: 12px; border-radius: 999px; background: #D4D4D8;"></span></span><span style="flex-grow: 1; height: 32px; border-radius: 7px; border: 1px solid #E4E4E7; background: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 15px; color: #71717A; display: flex; align-items: center; padding: 0 12px;">maybe.center/trial/dr-lipp/sales</span><span style="font-size: 14px; font-weight: 500; padding: 5px 10px; border-radius: 7px; border: 1px solid #E4E4E7; background: #FFFFFF;">Live prototype</span></div>
        <div data-live="sales-crm" style="position: relative; width: 934px; height: 780px; overflow: hidden; background: #FFFFFF;"><img class="shot" src="/_blob/9c698cb17bfa6413ac963157881f6a4d" alt="Screenshot of the live prototype at maybe.center/trial/dr-lipp/sales" style="--shot-scroll: -10%; display: block; width: 100%; height: auto;"></div>
      </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate": {"editor": "boolean", "default": true, "section": "Motion"}, "speed": {"editor": "enum", "options": ["slow", "normal", "fast"], "default": "normal", "section": "Motion"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.animate ?? true;
    const spd = { slow: 1.5, normal: 1, fast: 0.6 }[this.props.speed ?? 'normal'] ?? 1;
    return {
      animClass: on ? 'anim-on' : 'anim-off',
      spd: String(spd),
    };
  }
}
</script>
</body>
</html>
