<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAYBE · AI screening, from the other side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes rv{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%) rotate(4deg)}60%{transform:translateY(-6%) rotate(-2deg)}80%{transform:translateY(2%)}100%{transform:translateY(0) rotate(0)}}
@keyframes drift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.08) translateY(-4%)}}
@keyframes frame-in{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scroll-shot{0%,15%{transform:translateY(0)}55%,70%{transform:translateY(var(--shot-scroll,-18%))}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-on .rv{animation:rv calc(.7s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .rise{animation:rise calc(.8s * var(--spd)) cubic-bezier(.3,.7,.2,1) both}
.anim-on .drift{animation:drift calc(9s * var(--spd)) ease-in-out infinite alternate}
.anim-on .fin{animation:frame-in calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .shot{animation:scroll-shot calc(14s * var(--spd)) ease-in-out 1.4s infinite}
.anim-on .grow{transform-origin:left center;animation:grow calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rv,.rise,.drift,.fin,.shot,.grow{animation:none!important}}
</style>
</helmet>
<div class="{{animClass}}" style="--spd: {{spd}}; width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 0; top: 0; height: 4px; width: 0.0%; background: #7C3AED;"></div>
  <div style="position: absolute; left: 120px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center;">
    <p class="rv" style="margin: 0 0 18px; font-family: 'Geist Mono', monospace; font-size: 18px; color: #71717A; animation-delay: calc(var(--spd) * 0.00s);">For employers · today</p>
    <h2 class="rv" style="margin: 0; font-size: 68px; font-weight: 700; line-height: 1.02; letter-spacing: -0.045em; animation-delay: calc(var(--spd) * 0.08s);">AI screening, from the <span style="color: {{accent}};">other side</span>.</h2>
    <p class="rv" style="margin: 40px 0 0; font-size: 28px; line-height: 1.35; color: #52525B; animation-delay: calc(var(--spd) * 0.30s);">Fast for the company. A black box for the person applying. And the screener still never sees anyone <span style="color: #09090B; font-weight: 600;">do the job</span>.</p>
  </div>
  <div style="position: absolute; left: 720px; top: 150px; display: flex; gap: 40px;">
    <figure class="fin" style="margin: 0; width: 340px; display: flex; flex-direction: column; gap: 22px; animation-delay: calc(var(--spd) * 0.25s);">
      <div style="width: 340px; height: 640px; box-sizing: border-box; padding: 10px; border-radius: 46px; background: #09090B; box-shadow: 0 40px 80px -36px rgba(9,9,11,.55), inset 0 0 0 2px #27272A;">
        <div data-tiktok="https://www.tiktok.com/@its_ken04/video/7499859438732414251" data-autoplay="" style="position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: #18181B; color: #FAFAFA;">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
            <span style="display: grid; place-items: center; width: 76px; height: 76px; border-radius: 999px; background: rgba(255,255,255,.14);"><svg width="28" height="32" viewBox="0 0 28 32" aria-hidden="true"><path d="M4 2 L26 16 L4 30 Z" fill="#FAFAFA"/></svg></span>
            <span style="font-size: 18px; font-weight: 600;">TikTok</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #A1A1AA;">@its_ken04</span>
          </div>
        </div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #71717A;">@its_ken04 · May 2025</span>
        <span style="font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;">The AI interviewer glitches and repeats <span style="color: {{accent}};">“vertical bar pilates”</span> again and again.</span>
      </figcaption>
    </figure><figure class="fin" style="margin: 0; width: 340px; display: flex; flex-direction: column; gap: 22px; animation-delay: calc(var(--spd) * 0.40s);">
      <div style="width: 340px; height: 640px; box-sizing: border-box; padding: 10px; border-radius: 46px; background: #09090B; box-shadow: 0 40px 80px -36px rgba(9,9,11,.55), inset 0 0 0 2px #27272A;">
        <div data-tiktok="https://www.tiktok.com/@petobsessed777/video/7499996920622992682" style="position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: #18181B; color: #FAFAFA;">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
            <span style="display: grid; place-items: center; width: 76px; height: 76px; border-radius: 999px; background: rgba(255,255,255,.14);"><svg width="28" height="32" viewBox="0 0 28 32" aria-hidden="true"><path d="M4 2 L26 16 L4 30 Z" fill="#FAFAFA"/></svg></span>
            <span style="font-size: 18px; font-weight: 600;">TikTok</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #A1A1AA;">@petobsessed777</span>
          </div>
        </div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #71717A;">@petobsessed777 · May 2025</span>
        <span style="font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;">Expected a person. <span style="color: {{accent}};">Nobody said it would be AI.</span></span>
      </figcaption>
    </figure><figure class="fin" style="margin: 0; width: 340px; display: flex; flex-direction: column; gap: 22px; animation-delay: calc(var(--spd) * 0.55s);">
      <div style="width: 340px; height: 640px; box-sizing: border-box; padding: 10px; border-radius: 46px; background: #09090B; box-shadow: 0 40px 80px -36px rgba(9,9,11,.55), inset 0 0 0 2px #27272A;">
        <div data-tiktok="https://www.tiktok.com/@jerryjhlee/video/7354420966665014574" style="position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: #18181B; color: #FAFAFA;">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
            <span style="display: grid; place-items: center; width: 76px; height: 76px; border-radius: 999px; background: rgba(255,255,255,.14);"><svg width="28" height="32" viewBox="0 0 28 32" aria-hidden="true"><path d="M4 2 L26 16 L4 30 Z" fill="#FAFAFA"/></svg></span>
            <span style="font-size: 18px; font-weight: 600;">TikTok</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #A1A1AA;">@jerryjhlee</span>
          </div>
        </div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #71717A;">@jerryjhlee · 2024</span>
        <span style="font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;">How LinkedIn can <span style="color: {{accent}};">reject you automatically</span> after you apply.</span>
      </figcaption>
    </figure>
  </div>
  <p class="rv" style="position: absolute; right: 72px; bottom: 28px; margin: 0; font-size: 15px; color: #71717A; animation-delay: calc(var(--spd) * 1.00s);">Public TikToks, embedded from their creators. Individual experiences, not typical cases.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate": {"editor": "boolean", "default": true, "section": "Motion"}, "speed": {"editor": "enum", "options": ["slow", "normal", "fast"], "default": "normal", "section": "Motion"}, "accent": {"editor": "color", "options": ["#7C3AED", "#09090B", "#5B21B6"], "default": "#7C3AED", "section": "Look"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.animate ?? true;
    const spd = { slow: 1.5, normal: 1, fast: 0.6 }[this.props.speed ?? 'normal'] ?? 1;
    return { animClass: on ? 'anim-on' : 'anim-off', spd: String(spd), accent: this.props.accent ?? "#7C3AED" };
  }
}
</script>
</body>
</html>
