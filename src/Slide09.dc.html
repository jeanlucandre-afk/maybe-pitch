<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAYBE · Employer side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes rv{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%) rotate(4deg)}60%{transform:translateY(-6%) rotate(-2deg)}80%{transform:translateY(2%)}100%{transform:translateY(0) rotate(0)}}
@keyframes drift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.08) translateY(-4%)}}
@keyframes frame-in{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scroll-shot{0%,15%{transform:translateY(0)}55%,70%{transform:translateY(var(--shot-scroll,-18%))}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-on .rv{animation:rv calc(.7s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .rise{animation:rise calc(.8s * var(--spd)) cubic-bezier(.3,.7,.2,1) both}
.anim-on .drift{animation:drift calc(9s * var(--spd)) ease-in-out infinite alternate}
.anim-on .fin{animation:frame-in calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .shot{animation:scroll-shot calc(14s * var(--spd)) ease-in-out 1.4s infinite}
.anim-on .grow{transform-origin:left center;animation:grow calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rv,.rise,.drift,.fin,.shot,.grow{animation:none!important}}
</style>
</helmet>
<div class="{{animClass}}" style="--spd: {{spd}}; width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 0; top: 0; height: 4px; width: 81.8%; background: #7C3AED;"></div>
  <div style="position: absolute; left: 120px; right: 120px; top: 0; bottom: 0; display: grid; grid-template-columns: 600px 936px; gap: 72px; align-items: center;">
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <p class="rv" style="margin: 0 0 18px; font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500; letter-spacing: .02em; color: #71717A; animation-delay: calc(var(--spd) * 0.00s);"><span style="color: #5B21B6;">09</span> · For employers</p>
      
      <h2 class="rv" style="margin: 0; font-size: 80px; font-weight: 700; line-height: 1; letter-spacing: -0.045em; font-size: 72px; animation-delay: calc(var(--spd) * 0.18s);">Hire from work you can inspect.</h2>
      <p class="rv" style="margin: 22px 0 0; font-size: 28px; line-height: 1.45; color: #52525B; margin: 0; font-size: 26px; animation-delay: calc(var(--spd) * 0.27s);">Candidates who did your task, with transcripts, files and scores linked to a rubric.</p>
      <span class="rv" style="animation-delay: calc(var(--spd) * 0.36s); align-self: flex-start; height: 56px; padding: 0 24px; border-radius: 10px; border: 1px solid #E4E4E7; background: #FFFFFF; font-size: 20px; font-weight: 500; display: inline-flex; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.04);">Open a candidate's evidence</span>
    </div>
    <div class="fin" style="animation-delay: calc(var(--spd) * 0.18s); box-sizing: border-box; width: 936px; border: 1px solid #E4E4E7; border-radius: 16px; background: #FFFFFF; box-shadow: 0 30px 70px -30px rgba(9,9,11,.38); overflow: hidden; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #E4E4E7; background: #FAFAFA;"><span style="display: flex; gap: 7px;" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 999px; background: #D4D4D8;"></span><span style="width: 12px; height: 12px; border-radius: 999px; background: #D4D4D8;"></span><span style="width: 12px; height: 12px; border-radius: 999px; background: #D4D4D8;"></span></span><span style="flex-grow: 1; height: 32px; border-radius: 7px; border: 1px solid #E4E4E7; background: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 15px; color: #71717A; display: flex; align-items: center; padding: 0 12px;">maybe.center/employer/candidates</span><span style="font-size: 14px; font-weight: 500; padding: 5px 10px; border-radius: 7px; border: 1px solid #E4E4E7; background: #FFFFFF;">Live prototype</span></div>
        <div data-live="employer-board" style="position: relative; width: 934px; height: 780px; overflow: hidden; background: #FFFFFF;"><img class="shot" src="/_blob/49b32747e7e089b17d0b329fe5c38d09" alt="Screenshot of the live prototype at maybe.center/employer/candidates" style="--shot-scroll: -15%; display: block; width: 100%; height: auto;"></div>
      </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate": {"editor": "boolean", "default": true, "section": "Motion"}, "speed": {"editor": "enum", "options": ["slow", "normal", "fast"], "default": "normal", "section": "Motion"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.animate ?? true;
    const spd = { slow: 1.5, normal: 1, fast: 0.6 }[this.props.speed ?? 'normal'] ?? 1;
    return {
      animClass: on ? 'anim-on' : 'anim-off',
      spd: String(spd),
    };
  }
}
</script>
</body>
</html>
