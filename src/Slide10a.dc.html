<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAYBE · The market</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes rv{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%) rotate(4deg)}60%{transform:translateY(-6%) rotate(-2deg)}80%{transform:translateY(2%)}100%{transform:translateY(0) rotate(0)}}
@keyframes drift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.08) translateY(-4%)}}
@keyframes frame-in{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scroll-shot{0%,15%{transform:translateY(0)}55%,70%{transform:translateY(var(--shot-scroll,-18%))}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-on .rv{animation:rv calc(.7s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .rise{animation:rise calc(.8s * var(--spd)) cubic-bezier(.3,.7,.2,1) both}
.anim-on .drift{animation:drift calc(9s * var(--spd)) ease-in-out infinite alternate}
.anim-on .fin{animation:frame-in calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .shot{animation:scroll-shot calc(14s * var(--spd)) ease-in-out 1.4s infinite}
.anim-on .grow{transform-origin:left center;animation:grow calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rv,.rise,.drift,.fin,.shot,.grow{animation:none!important}}
</style>
<style>
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.anim-on .growy{transform-origin:center bottom;animation:growy calc(1s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw calc(1.4s * var(--spd)) cubic-bezier(.4,0,.2,1) both}
.anim-on .pop{animation:pop calc(.5s * var(--spd)) cubic-bezier(.2,.7,.2,1.2) both}
@media (prefers-reduced-motion:reduce){.growy,.draw,.pop{animation:none!important;stroke-dashoffset:0}}
</style>
</helmet>
<div class="{{animClass}}" style="--spd: {{spd}}; width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 0; top: 0; height: 4px; width: 0.0%; background: #7C3AED;"></div>
  <div style="position: absolute; left: 160px; top: 140px; width: 1000px;">
    <h2 class="rv" style="margin: 0px 0 0; font-size: 80px; font-weight: 700; line-height: 1.02; letter-spacing: -0.045em; max-width: 16ch; animation-delay: calc(var(--spd) * 0.05s);">A <span style="color: {{accent}};">$5.1B</span> market, set to almost double.</h2>
  </div>
  <div style="position: absolute; left: 160px; bottom: 110px; display: flex; align-items: flex-end; gap: 48px; border-bottom: 2px solid #09090B; padding: 0 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 200px;"><span class="rv" style="font-family: 'Geist Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: -0.04em; animation-delay: calc(var(--spd) * 0.80s);">$4<span style="margin: 0 -0.22em;">.</span>8B</span><span class="growy" style="display: block; width: 200px; height: 230px; border-radius: 12px 12px 0 0; background: #D4D4D8; animation-delay: calc(var(--spd) * 0.30s);"></span><span style="font-family: 'Geist Mono', monospace; font-size: 20px; color: #52525B;">2025</span><span style="font-size: 16px; color: #71717A; height: 20px;"></span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 200px;"><span class="rv" style="font-family: 'Geist Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: -0.04em; animation-delay: calc(var(--spd) * 0.95s);">$5<span style="margin: 0 -0.22em;">.</span>1B</span><span class="growy" style="display: block; width: 200px; height: 245px; border-radius: 12px 12px 0 0; background: {{accent}}; animation-delay: calc(var(--spd) * 0.45s);"></span><span style="font-family: 'Geist Mono', monospace; font-size: 20px; color: #52525B;">2026</span><span style="font-size: 16px; color: #71717A; height: 20px;"></span></div>
    <span style="width: 120px; align-self: center; border-top: 2px dashed #D4D4D8;" aria-hidden="true"></span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 200px;"><span class="rv" style="font-family: 'Geist Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: -0.04em; animation-delay: calc(var(--spd) * 1.10s);">$9<span style="margin: 0 -0.22em;">.</span>6B</span><span class="growy" style="display: block; width: 200px; height: 460px; border-radius: 12px 12px 0 0; background: #EDE9FE; animation-delay: calc(var(--spd) * 0.60s);"></span><span style="font-family: 'Geist Mono', monospace; font-size: 20px; color: #52525B;">2035</span><span style="font-size: 16px; color: #71717A; height: 20px;">forecast · 7.2% a year</span></div>
  </div>
  <div style="position: absolute; right: 160px; bottom: 150px; display: flex; flex-direction: column; gap: 40px;">
    <p class="rv" style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 16px; text-transform: uppercase; letter-spacing: .08em; color: #71717A; animation-delay: calc(var(--spd) * 1.00s);">Employers today</p>
    <div class="rv" style="display: flex; flex-direction: column; gap: 12px; width: 560px; animation-delay: calc(var(--spd) * 1.10s);"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px;"><span style="font-size: 24px; line-height: 1.35; color: #52525B;">get too many unqualified applicants</span><span style="font-family: 'Geist Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: -0.04em; color: #09090B; flex: none;">55<span style="margin: 0 -0.22em;">.</span>7%</span></div><span style="display: block; height: 14px; border-radius: 999px; background: #F4F4F5; overflow: hidden;"><span class="grow" style="display: block; height: 14px; width: 55.7%; border-radius: 999px; background: #09090B; animation-delay: calc(var(--spd) * 1.25s);"></span></span></div>
    <div class="rv" style="display: flex; flex-direction: column; gap: 12px; width: 560px; animation-delay: calc(var(--spd) * 1.30s);"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px;"><span style="font-size: 24px; line-height: 1.35; color: #52525B;">want skills assessments</span><span style="font-family: 'Geist Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: -0.04em; color: #09090B; flex: none;">34<span style="margin: 0 -0.22em;">.</span>6%</span></div><span style="display: block; height: 14px; border-radius: 999px; background: #F4F4F5; overflow: hidden;"><span class="grow" style="display: block; height: 14px; width: 34.6%; border-radius: 999px; background: {{accent}}; animation-delay: calc(var(--spd) * 1.45s);"></span></span></div>
  </div>
  <p class="rv" style="position: absolute; right: 72px; bottom: 32px; margin: 0; max-width: 1100px; text-align: right; font-size: 16px; line-height: 1.45; color: #71717A; animation-delay: calc(var(--spd) * 1.50s);">Grand View Research, AI Recruitment Market · iHire, State of Online Recruiting 2026 (318 U.S. employers)</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate": {"editor": "boolean", "default": true, "section": "Motion"}, "speed": {"editor": "enum", "options": ["slow", "normal", "fast"], "default": "normal", "section": "Motion"}, "accent": {"editor": "color", "options": ["#7C3AED", "#09090B", "#5B21B6"], "default": "#7C3AED", "section": "Look"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.animate ?? true;
    const spd = { slow: 1.5, normal: 1, fast: 0.6 }[this.props.speed ?? 'normal'] ?? 1;
    return {
      animClass: on ? 'anim-on' : 'anim-off',
      spd: String(spd),
      accent: this.props.accent ?? "#7C3AED",
    };
  }
}
</script>
</body>
</html>
