<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAYBE · Title</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes mb-intro-out{0%,96%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.mb-intro{opacity:1}
.mb-playing .mb-intro{animation:mb-intro-out 6.43s linear both}
.mb-intro-off .mb-intro,.mb-intro-off .mb-black,.mb-playing .mb-black{display:none}
.mb-black{position:absolute;inset:0;background:#09090B}
</style>
</helmet>
<div class="{{rootClass}}" ref="{{setRoot}}" style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #FFFFFF;">
<div style="position: absolute; inset: 0; background: #FFFFFF; color: #09090B; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; left: 0; top: 0; height: 4px; width: 9.1%; background: #7C3AED;"></div>
  <p style="position: absolute; left: 120px; top: 112px; margin: 0; font-family: 'Geist Mono', monospace; font-size: 24px; font-weight: 500; letter-spacing: .02em; color: #71717A;"><span style="color: #5B21B6;">Macromedia × CODE Hackathon</span> · 2026</p>
  <div style="position: absolute; left: 120px; right: 120px; bottom: 120px; display: flex; flex-direction: column; gap: 64px;">
    <h1 style="margin: 0; line-height: 0;"><img src="deck/img/maybe-wordmark.svg" alt="MAYBE." style="display: block; height: 359px; width: auto;"></h1>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 48px;">
      <h2 style="margin: 0; font-size: 68px; font-weight: 600; line-height: 1; letter-spacing: -0.04em;">Try real work before you choose it.</h2>
      <div style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
        <p style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #71717A;">By</p>
        <p style="margin: 0; font-size: 68px; font-weight: 600; line-height: 1; letter-spacing: -0.04em;">Boris &amp; Luc</p>
      </div>
    </div>
  </div>
</div>
<video class="mb-intro" ref="{{setVideo}}" src="/_blob/2c1cc64d39d1f024e59572de09cee528" muted="" playsinline="" preload="auto" aria-hidden="true" style="position: absolute; inset: 0; width: 1920px; height: 1080px; display: block;"></video>
<div class="mb-black" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"intro": {"editor": "boolean", "default": true, "section": "Motion"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (!this.root || typeof IntersectionObserver === 'undefined') return;
    this.io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.intersectionRatio >= 0.6) this.begin();
        else if (e.intersectionRatio === 0) this.reset();
      }
    }, { threshold: [0, 0.6] });
    this.io.observe(this.root);
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); clearTimeout(this.timer); }
  begin() {
    if ((this.props.intro ?? true) === false || (this.state && this.state.started)) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {          // let the slide change settle first
      this.setState({ started: true });
      const v = this.video;
      if (v) { v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    }, 250);
  }
  reset() {
    clearTimeout(this.timer);
    if (!(this.state && this.state.started)) return;
    this.setState({ started: false });
    const v = this.video;
    if (v) { v.pause(); v.currentTime = 0; }
  }
  renderVals() {
    const on = this.props.intro ?? true;
    const started = !!(this.state && this.state.started);
    return {
      rootClass: !on ? 'mb-intro-off' : (started ? 'mb-playing' : 'mb-waiting'),
      setRoot: (el) => { this.root = el; },
      setVideo: (el) => { this.video = el; },
    };
  }
}
</script>
</body>
</html>
