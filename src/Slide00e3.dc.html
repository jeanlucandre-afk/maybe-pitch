<style>
body{margin:0}
a{color:#09090B}a:hover{color:#52525B}
@keyframes rv{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%) rotate(4deg)}60%{transform:translateY(-6%) rotate(-2deg)}80%{transform:translateY(2%)}100%{transform:translateY(0) rotate(0)}}
@keyframes drift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.08) translateY(-4%)}}
@keyframes frame-in{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scroll-shot{0%,15%{transform:translateY(0)}55%,70%{transform:translateY(var(--shot-scroll,-18%))}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-on .rv{animation:rv calc(.7s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .rise{animation:rise calc(.8s * var(--spd)) cubic-bezier(.3,.7,.2,1) both}
.anim-on .drift{animation:drift calc(9s * var(--spd)) ease-in-out infinite alternate}
.anim-on .fin{animation:frame-in calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
.anim-on .shot{animation:scroll-shot calc(14s * var(--spd)) ease-in-out 1.4s infinite}
.anim-on .grow{transform-origin:left center;animation:grow calc(.9s * var(--spd)) cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rv,.rise,.drift,.fin,.shot,.grow{animation:none!important}}
</style>
</helmet>

            <span style="font-size: 17px; font-weight: 600;">TikTok</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #A1A1AA;">@its_ken04</span>
          </div>
        </div>
      </div>

        <span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #71717A;">TikTok · @its_ken04 · May 2025</span>

      </figcaption>
    </figure><figure class="fin" style="margin: 0; width: 300px; display: flex; flex-direction: column; gap: 18px; animation-delay: calc(var(--spd) * 0.57s);">

        <span style="font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;">Expected a person. <span style="color: {{accent}};">Nobody said it would be AI.</span></span>
      </figcaption>
    </figure><figure class="fin" style="margin: 0; width: 300px; display: flex; flex-direction: column; gap: 18px; animation-delay: calc(var(--spd) * 0.69s);">
      <div style="width: 300px; height: 560px; box-sizing: border-box; padding: 9px; border-radius: 42px; background: #09090B; box-shadow: 0 40px 80px -36px rgba(9,9,11,.55), inset 0 0 0 2px #27272A;">
        <div data-tiktok="https://www.tiktok.com/@jerryjhlee/video/7354420966665014574" style="position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #18181B; color: #FAFAFA;">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">

            <span style="font-size: 17px; font-weight: 600;">TikTok</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #A1A1AA;">@jerryjhlee</span>

      <figcaption style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #71717A;">TikTok · @jerryjhlee · 2024</span>

    </figure>
  </div>
  <p class="rv" style="position: absolute; right: 72px; bottom: 28px; margin: 0; font-size: 15px; color: #71717A; animation-delay: calc(var(--spd) * 1.00s);">Public posts by their creators. Individual accounts, not verified and not typical cases.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate": {"editor": "boolean", "default": true, "section": "Motion"}, "speed": {"editor": "enum", "options": ["slow", "normal", "fast"], "default": "normal", "section": "Motion"}, "accent": {"editor": "color", "options": ["#7C3AED", "#09090B", "#5B21B6"], "default": "#7C3AED", "section": "Look"}, "$preview": {"width": 1920, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.animate ?? true;
    const spd = { slow: 1.5, normal: 1, fast: 0.6 }[this.props.speed ?? 'normal'] ?? 1;
    return { animClass: on ? 'anim-on' : 'anim-off', spd: String(spd), accent: this.props.accent ?? "#7C3AED" };
  }
}
</script>
</body>
